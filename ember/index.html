<!DOCTYPE swiftui+vml>
<vml lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    {{content-for "head"}}

    <link integrity="" rel="stylesheet" href="/@embroider/virtual/vendor.css">
    <link integrity="" rel="stylesheet" href="/@embroider/virtual/app.css">

    {{content-for "head-footer"}}
  </head>
  <body>
    {{content-for "body"}}
    <text>Hello world from body!!</text>
    <vstack id="app-wrapper"></vstack>
    <script src="/@embroider/virtual/vendor.js"></script>
    <script type="module">
      import Application from './app/app';
      // import environment from './app/config/environment';
      setTimeout(() => {
        debugger;
        // environment.APP
        Application.create({
          // Here you can pass flags/options to your application instance
          // when it is created
          rootElement: '#app-wrapper',
        });
        debugger;
      }, 8000);
    </script>
    <text>goodbye world from body!</text>

    {{content-for "body-footer"}}
  </body>
</vml>
